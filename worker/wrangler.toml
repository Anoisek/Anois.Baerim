name = "baerim-images-worker"
main = "src/index.js"
compatibility_date = "2026-08-15"

[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "baerim-images"

# Lets the Ore Finder channel reader hand each batch of channels to a separate
# invocation of this same Worker (own 50-subrequest budget) - src/oreFinderReader.js.
[[services]]
binding = "SELF"
service = "baerim-images-worker"

# Ore Finder channel reader: every minute of the website's ore-report windows
# xx:58-xx:09 and xx:28-xx:39 (UTC minutes are the same in every whole-hour
# timezone). For testing around the clock use "* * * * *" together with
# ORE_FINDER_READER_TEST_CHANNEL_ID.
[triggers]
crons = ["58,59,0-9,28-39 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "baerim-db"
database_id = "e8bb727e-3582-4356-90f8-d956fc653fb0"

# Secrets (set via `wrangler secret put <NAME>`, not stored here):
#   SUPABASE_URL
#   SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY
#   VAPID_PRIVATE_KEY_JWK           - dogtracker Web Push signing key (JSON JWK)
#   DISCORD_BOT_TOKEN               - dogtracker Discord alert bot
#   ORE_FINDER_DISCORD_BOT_TOKEN    - ore finder Discord alert bot (separate bot/token from dogtracker's)

[vars]
PUBLIC_R2_URL = "https://baerim-images-worker.bartoszlisowiec.workers.dev"
OLD_PUBLIC_R2_URL = "https://pub-ca333e738137481fa823decac7e5d3f8.r2.dev"
ALLOWED_ORIGINS = "https://baerimtools.com,https://www.baerimtools.com,https://anois-baerim.pages.dev"
VAPID_PUBLIC_KEY = "BLdZQ3ulehTXPJ7XBj2LDiI1YGUe9AWk0EaEk5J-q_rkUjd8ZgOqQCtbVuEFETN20Vv0oS2gz1M71yepJAEeTs4"
VAPID_SUBJECT = "mailto:anois131313@gmail.com"
DISCORD_CHANNEL_ID = "1548329118213607514"
DISCORD_ROLE_ID = "1548329137930772510"
# Ore finder alert bot - separate bot/channel/role from the dogtracker ones above.
# ORE_FINDER_DISCORD_CHANNEL_ID/ROLE_ID is the legacy single-server destination -
# always sent to in addition to whatever servers have configured themselves via
# the /orefinder-here and /orefinder-role slash commands (see ore_finder_discord_configs).
ORE_FINDER_DISCORD_CHANNEL_ID = "1520001195840901240"
ORE_FINDER_DISCORD_ROLE_ID = "1520010923815866409"
# Application ID from the bot token (public, same value as in the invite link) -
# needed to register the two slash commands with Discord's API.
ORE_FINDER_DISCORD_APPLICATION_ID = "1549119137903812729"
# Public key from the Discord Developer Portal (General Information page) -
# used to verify that /discord/interactions requests really come from Discord.
# Not a secret (it's the public half of the signing key), but not filled in yet.
ORE_FINDER_DISCORD_PUBLIC_KEY = "76afdd66e3b76a5039fc318168ba5fea7fe358a149a49a49cee77fe3e8d918a3"
# Ore Finder channel reader (src/oreFinderReader.js): "1" = on, anything else = off.
ORE_FINDER_READER_ENABLED = "1"
